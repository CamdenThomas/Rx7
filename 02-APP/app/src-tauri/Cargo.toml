[package]
name = "rx7"
version = "0.1.0"
description = "Rx7 - the car's record, read and answered"
authors = ["Camden Thomas"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "rx7_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
tauri-plugin-http = "~2.6"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
# Bluetooth LE for Connect and log and the Scan page (D-495, BL2). Pinned exactly: the plugin
# is young and its API has moved between minor versions (confirm at each bump).
tauri-plugin-blec = "=0.17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
