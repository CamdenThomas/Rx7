<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="1074" viewBox="0 0 1310 1074" font-family="Noto Sans, sans-serif">
<title>Control Unit Remote - plan sheet</title>
<rect width="100%" height="100%" fill="#fff"/>
<text x="30.0" y="40.0" font-size="20" text-anchor="start" font-weight="700" fill="#1f2328">CONTROL UNIT REMOTE · PLAN SHEET</text>
<text x="30.0" y="64.0" font-size="12" text-anchor="start" font-weight="400" fill="#57606a">State: drawn.  Rulings: D-586 D-597 D-598 D-602 D-604 D-615.  Part folder: 00-design/control-unit/control-unit-remote/</text>
<text x="30.0" y="100.0" font-size="10" text-anchor="start" font-weight="700" fill="#57606a">WHERE IT SITS</text>
<text x="30.0" y="118.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2328">right of the steering wheel, high beside the DU (D-586)</text>
<text x="670.0" y="100.0" font-size="10" text-anchor="start" font-weight="700" fill="#57606a">NOTE</text>
<text x="670.0" y="118.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2328">Drawn at Y71 (D-615): the CUR board and the CUR's mock-up. Every part is a class until bought (R11); the</text>
<text x="670.0" y="136.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2328">space right of the wheel is unmeasured</text>
<text x="30.0" y="164.0" font-size="10" text-anchor="start" font-weight="700" fill="#57606a">WHAT IT HOLDS</text>
<text x="30.0" y="182.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2328">the CUR board (the CUR board, rev 1.00, D-615): the hazard, both winks, the hatch and fuel-door keys, the 4-way mirror control, the 9 mm screen-knob encoder; an IS31FL3218 for the lights and a PCA9555 on its own 3.3</text>
<text x="30.0" y="200.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2328">V regulator so the keys, the mirror control and the knob ride the I2C bus (D-604)</text>
<text x="30.0" y="228.0" font-size="10" text-anchor="start" font-weight="700" fill="#57606a">HOW IT JOINS THE HARNESS</text>
<text x="30.0" y="246.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2328">a sealed nine-wire pigtail through its rear cover's grommet to an inline DRC 24, DP-CUR (D-597, D-615): four wires to the CU, five to the PMU box</text>
<text x="30.0" y="274.0" font-size="10" text-anchor="start" font-weight="700" fill="#57606a">ALSO IN ITS DIAGRAMS FOLDER</text>
<text x="30.0" y="292.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2328">cur-face-concept.html</text>
<text x="30.0" y="320.0" font-size="10" text-anchor="start" font-weight="700" fill="#57606a">ITS PLUGS, CAVITY BY CAVITY</text>
