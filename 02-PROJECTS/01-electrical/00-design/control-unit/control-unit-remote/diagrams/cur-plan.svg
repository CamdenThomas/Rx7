<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="876" viewBox="0 0 1310 876" font-family="Noto Sans, sans-serif">
<title>Control Unit Remote - plan sheet</title>
<rect width="100%" height="100%" fill="#fff"/>
<text x="30.0" y="40.0" font-size="20" text-anchor="start" font-weight="700" fill="#1f2328">CONTROL UNIT REMOTE · PLAN SHEET</text>
<text x="30.0" y="64.0" font-size="12" text-anchor="start" font-weight="400" fill="#57606a">State: planned - its CAD is Y71.  Rulings: D-586 D-597 D-598 D-602 D-604.  Part folder: 00-design/control-unit/control-unit-remote/</text>
<text x="30.0" y="100.0" font-size="10" text-anchor="start" font-weight="700" fill="#57606a">WHERE IT SITS</text>
<text x="30.0" y="118.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2328">right of the steering wheel, high beside the DU (D-586)</text>
<text x="670.0" y="100.0" font-size="10" text-anchor="start" font-weight="700" fill="#57606a">NOTE</text>
<text x="670.0" y="118.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2328">Its board is redrawn at the CAD pass (Y71).</text>
<text x="30.0" y="146.0" font-size="10" text-anchor="start" font-weight="700" fill="#57606a">WHAT IT HOLDS</text>
<text x="30.0" y="164.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2328">the CUR board: the screen knob, the mirror stick, the hazard, both winks, the fuel-door and hatch keys, an I/O expander and an I2C ADC so the keys and stick ride the I2C bus (D-604)</text>
<text x="30.0" y="192.0" font-size="10" text-anchor="start" font-weight="700" fill="#57606a">HOW IT JOINS THE HARNESS</text>
<text x="30.0" y="210.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2328">DP-CUR, one DRC 24-way (D-597): four wires to the CU, five to the PMU box</text>
<text x="30.0" y="238.0" font-size="10" text-anchor="start" font-weight="700" fill="#57606a">ALSO IN ITS DIAGRAMS FOLDER</text>
<text x="30.0" y="256.0" font-size="12" text-anchor="start" font-weight="400" fill="#1f2328">cur-face-concept.html</text>
<text x="30.0" y="284.0" font-size="10" text-anchor="start" font-weight="700" fill="#57606a">ITS PLUGS, CAVITY BY CAVITY</text>
<rect x="30.0" y="300.0" width="360.0" height="480.0" rx="5" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
