<path d="M585.0,430.0 L585.0,280.0" fill="none" stroke="#b8bec6" stroke-width="4" stroke-linejoin="round"/>
<text x="600.0" y="345.0" font-size="11" text-anchor="start" font-weight="700" fill="#1f2328">17 wires</text>
<text x="600.0" y="362.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">hard-wired at the box</text>
<text x="600.0" y="379.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">DP-ICU at the DU</text>
<path d="M750.0,560.0 L860.0,560.0" fill="none" stroke="#1f2328" stroke-width="6" stroke-linejoin="round"/>
<path d="M750.0,560.0 L860.0,560.0" fill="none" stroke="#b8bec6" stroke-width="4" stroke-linejoin="round"/>
