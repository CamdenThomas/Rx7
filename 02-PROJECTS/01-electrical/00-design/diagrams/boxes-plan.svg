<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="930" viewBox="0 0 1700 930" font-family="Noto Sans, sans-serif">
<title>The boxes - overview</title>
<rect width="100%" height="100%" fill="#fff"/>
<text x="30.0" y="40.0" font-size="20" text-anchor="start" font-weight="700" fill="#1f2328">THE BOXES · OVERVIEW</text>
<text x="30.0" y="64.0" font-size="12" text-anchor="start" font-weight="400" fill="#57606a">Every box of the overhaul in its zone, with the wires and cables that join them (D-596 to D-612). Each box's own sheet is in its part folder. Generated by rx7.py diagrams - do not edit.</text>
<rect x="30.0" y="96.0" width="300.0" height="800.0" rx="10" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="44.0" y="118.0" font-size="11" text-anchor="start" font-weight="700" fill="#57606a">ENGINE BAY</text>
<rect x="380.0" y="96.0" width="800.0" height="800.0" rx="10" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="394.0" y="118.0" font-size="11" text-anchor="start" font-weight="700" fill="#57606a">DASH ZONE · wire only</text>
<rect x="1260.0" y="96.0" width="410.0" height="800.0" rx="10" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="1274.0" y="118.0" font-size="11" text-anchor="start" font-weight="700" fill="#57606a">PASSENGER-SIDE CARGO BIN</text>
<rect x="50.0" y="420.0" width="250.0" height="170.0" rx="8" fill="#fff" stroke="#1f2328" stroke-width="2.5"/>
<text x="64.0" y="446.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2328">Bay junction</text>
<text x="64.0" y="472.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">the covered positive jump post, the</text>
<text x="64.0" y="488.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">ground post beside it, F17 and F18</text>
<text x="64.0" y="504.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">(MIDI), the start relay K9 (D-609)</text>
<rect x="420.0" y="130.0" width="330.0" height="150.0" rx="8" fill="#fff" stroke="#1f2328" stroke-width="2.5"/>
<text x="434.0" y="156.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2328">Display Unit</text>
<text x="434.0" y="178.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2328">DP-ICU · DRC16-24SA · 19 of 24 in use</text>
<text x="434.0" y="198.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">the 12.3-inch display, the BT817 board, the DU carrier</text>
<text x="434.0" y="214.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">(ICU in the tables, D-496), the radio; the AEM wideband</text>
<text x="434.0" y="230.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">gauge whole, in its case, on its own feed and ground,</text>
<text x="434.0" y="246.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">its CAN on the DU's CAN2 pair inside (D-596)</text>
<rect x="860.0" y="130.0" width="290.0" height="150.0" rx="8" fill="#fff" stroke="#1f2328" stroke-width="2.5"/>
<text x="874.0" y="156.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2328">Control Unit Remote</text>
<text x="874.0" y="178.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2328">DP-CUR · DRC16-24SA · 9 of 24 in use</text>
<text x="874.0" y="198.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">the CUR board: the screen knob, the mirror</text>
<text x="874.0" y="214.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">stick, the hazard, both winks, the fuel-door and</text>
<text x="874.0" y="230.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">hatch keys, an I/O expander and an I2C ADC so</text>
<text x="874.0" y="246.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">the keys and stick ride the I2C bus (D-604)</text>
<rect x="420.0" y="430.0" width="330.0" height="230.0" rx="8" fill="#fff" stroke="#1f2328" stroke-width="2.5"/>
<text x="434.0" y="456.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2328">PMU box</text>
<text x="434.0" y="478.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2328">L1-E1 · circular · 11 of 29 in use</text>
<text x="434.0" y="494.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2328">L2-F1 · circular · 17 of 21 in use</text>
<text x="434.0" y="510.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2328">L3-COL · hard-wired bundle · 14 of 14 in use</text>
<text x="434.0" y="526.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2328">L3-DASH · hard-wired bundle · 2 of 2 in use</text>
<text x="434.0" y="542.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2328">L3-HU · hard-wired bundle · 3 of 3 in use</text>
<text x="434.0" y="558.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2328">L4-R1 · circular · 13 of 21 in use</text>
<text x="434.0" y="578.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">the PMU-24 DL on its own 39-way plug, its case one</text>
<text x="434.0" y="594.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">outside wall (D-596); eight smart high-side switches in</text>
<text x="434.0" y="610.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">place of K1-K4, K11, K12, K14, K15 and K13 a relay in a</text>
<text x="434.0" y="626.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">socket (D-597, D-352); the windows' two H-bridges in</text>
<rect x="860.0" y="470.0" width="290.0" height="170.0" rx="8" fill="#fff" stroke="#1f2328" stroke-width="2.5"/>
<text x="874.0" y="496.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2328">Control Unit</text>
<text x="874.0" y="518.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2328">DP-DCU · DRC26-24SA+DRC26-40SA · 41 of 64 …</text>
<text x="874.0" y="534.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2328">DP-DCU-P · DTP06-2S · 2 of 2 in use</text>
<text x="874.0" y="554.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">the CU carrier (DCU in the tables), the face board</text>
<text x="874.0" y="570.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">behind the eighth-pass face (D-602), the seats'</text>
<text x="874.0" y="586.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">heat and cool on + side smart switches with no</text>
<text x="874.0" y="602.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">fuses (D-597), the radar receiver once picked</text>
<rect x="1290.0" y="400.0" width="350.0" height="170.0" rx="8" fill="#fff" stroke="#1f2328" stroke-width="2.5"/>
<text x="1304.0" y="426.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2328">Bin box</text>
<text x="1304.0" y="452.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">the master disconnect, its knob through the lid (D-319); the</text>
<text x="1304.0" y="468.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">Class-T 150 A; the 2151 dual MRBF block with the starter's</text>
<text x="1304.0" y="484.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">250 A and the amplifier's F34 (D-560); F38; a negative bus</text>
<rect x="1290.0" y="690.0" width="350.0" height="150.0" rx="8" fill="#fff" stroke="#1f2328" stroke-width="2.5"/>
<text x="1304.0" y="716.0" font-size="16" text-anchor="start" font-weight="700" fill="#1f2328">Amplifier dock</text>
<text x="1304.0" y="738.0" font-size="11" text-anchor="start" font-weight="400" fill="#1f2328">L4-AMP · circular · 23 of 29 in use</text>
<text x="1304.0" y="758.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">the DSP amplifier (luxury LP57, not picked) and the</text>
<text x="1304.0" y="774.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">home-built upmix (LP56) built as its connector board, the</text>
<text x="1304.0" y="790.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">digital link between them inside (D-503, D-609)</text>
