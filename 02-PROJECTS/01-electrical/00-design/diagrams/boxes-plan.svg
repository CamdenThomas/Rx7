<text x="805.0" y="607.0" font-size="11" text-anchor="middle" font-weight="400" fill="#57606a">DP-DCU, DP-DCU-P</text>
<path d="M750.0,450.0 L900.0,450.0 L900.0,280.0" fill="none" stroke="#1f2328" stroke-width="6" stroke-linejoin="round"/>
<path d="M750.0,450.0 L900.0,450.0 L900.0,280.0" fill="none" stroke="#b8bec6" stroke-width="4" stroke-linejoin="round"/>
<text x="915.0" y="345.0" font-size="11" text-anchor="start" font-weight="700" fill="#1f2328">5 wires</text>
<text x="915.0" y="362.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">winks · hazard</text>
<path d="M1090.0,470.0 L1090.0,280.0" fill="none" stroke="#1f2328" stroke-width="6" stroke-linejoin="round"/>
<path d="M1090.0,470.0 L1090.0,280.0" fill="none" stroke="#b8bec6" stroke-width="4" stroke-linejoin="round"/>
<text x="1105.0" y="380.0" font-size="11" text-anchor="start" font-weight="700" fill="#1f2328">4 wires</text>
<text x="1105.0" y="397.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">I²C</text>
<path d="M700.0,660.0 L700.0,700.0 L1220.0,700.0 L1220.0,500.0 L1290.0,500.0" fill="none" stroke="#1f2328" stroke-width="8" stroke-linejoin="round"/>
<path d="M700.0,660.0 L700.0,700.0 L1220.0,700.0 L1220.0,500.0 L1290.0,500.0" fill="none" stroke="#d32f2f" stroke-width="6" stroke-linejoin="round"/>
<text x="960.0" y="726.0" font-size="11" text-anchor="middle" font-weight="700" fill="#1f2328">C03 2 AWG</text>
<text x="960.0" y="743.0" font-size="11" text-anchor="middle" font-weight="400" fill="#57606a">the PMU box's feed</text>
<path d="M1465.0,570.0 L1465.0,690.0" fill="none" stroke="#1f2328" stroke-width="8" stroke-linejoin="round"/>
<path d="M1465.0,570.0 L1465.0,690.0" fill="none" stroke="#d32f2f" stroke-width="6" stroke-linejoin="round"/>
<text x="1480.0" y="620.0" font-size="11" text-anchor="start" font-weight="700" fill="#1f2328">C13 4 AWG · C14 4 AWG</text>
<text x="1480.0" y="637.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">two bolted leads</text>
<path d="M175.0,590.0 L175.0,870.0 L1655.0,870.0 L1655.0,485.0 L1640.0,485.0" fill="none" stroke="#1f2328" stroke-width="8" stroke-linejoin="round"/>
<path d="M175.0,590.0 L175.0,870.0 L1655.0,870.0 L1655.0,485.0 L1640.0,485.0" fill="none" stroke="#d32f2f" stroke-width="6" stroke-linejoin="round"/>
<text x="915.0" y="828.0" font-size="11" text-anchor="middle" font-weight="700" fill="#1f2328">C04 1/0 AWG · C11 1/0 AWG</text>
<text x="915.0" y="845.0" font-size="11" text-anchor="middle" font-weight="400" fill="#57606a">forward under the car: the starter feed and the cranking return</text>
<path d="M420.0,600.0 L330.0,600.0" fill="none" stroke="#1f2328" stroke-width="6" stroke-linejoin="round"/>
<path d="M420.0,600.0 L330.0,600.0" fill="none" stroke="#8d949e" stroke-width="4" stroke-linejoin="round"/>
<text x="345.0" y="625.0" font-size="11" text-anchor="start" font-weight="700" fill="#1f2328">engine</text>
<text x="345.0" y="642.0" font-size="11" text-anchor="start" font-weight="400" fill="#57606a">L1-E1 to E3</text>
<path d="M420.0,470.0 L330.0,470.0" fill="none" stroke="#1f2328" stroke-width="6" stroke-linejoin="round"/>
<path d="M420.0,470.0 L330.0,470.0" fill="none" stroke="#8d949e" stroke-width="4" stroke-linejoin="round"/>
<text x="345.0" y="455.0" font-size="11" text-anchor="start" font-weight="700" fill="#1f2328">front, rear</text>
<text x="30.0" y="920.0" font-size="10" text-anchor="start" font-weight="400" fill="#57606a">Grey: signal and switched wiring. Red: heavy cable. Counts are the record's live and capped cavities whose far end is in the other box.</text>
</svg>
