<text x="430" y="830" class="b">CAN2 · 500 kbps · PMU, keypad, ICU, DCU, future LS ECU (D-079) · 120 Ω at the PMU (software) and at the engine-bay drop</text>
<text x="1104" y="66" class="b">engine-bay drop, L1-S1 9/10</text>
<rect x="20" y="430" width="380" height="370" class="zone"/>
<text x="32" y="448" class="h">HOW TO READ IT</text>
<text x="32" y="470" class="t">Power: battery → Class-T → disconnect → 2 AWG → DP-BAT</text>
<text x="32" y="484" class="t">→ PMU stud. The starter is its own run off the</text>
<text x="32" y="498" class="t">distribution post (D-061).</text>
<text x="32" y="526" class="t">Four legs leave the dash post, housings by class:</text>
<text x="32" y="540" class="t">-P 12 AWG DTP · -M 14 AWG DT · -S 16 AWG DT (D-032).</text>
<text x="32" y="568" class="t">Every zone grounds at its own star node; grounds never</text>
<text x="32" y="582" class="t">cross a bulkhead (D-017) — which retires fault K-008.</text>
<text x="32" y="610" class="t">Switches are resistor ladders to ground on A1–A8 and</text>
<text x="32" y="624" class="t">A15/A16; no switch carries load current (D-018, D-019).</text>
<text x="32" y="652" class="t">The car drives fully on the PMU with dumb switches</text>
<text x="32" y="666" class="t">before either module is connected (D-081).</text>
<text x="32" y="694" class="t">Every cavity carries a status word — LIVE · PROVISIONED</text>
<text x="32" y="708" class="t">· RESERVED · DEFERRED · OPEN · SPARE (SPEC §12).</text>
<text x="32" y="722" class="t">Open packets today: Q-061 … Q-065.</text>
<text x="32" y="750" class="s">Per-leg cavity diagrams (generated by tools/gen.py):</text>
<text x="32" y="763" class="s">L1-engine · L2-front-chassis · L3-dash · L4-rear-cabin</text>
<text x="32" y="776" class="s">sill-doors · dash-post-drops. This sheet is hand-drawn.</text>
</svg>