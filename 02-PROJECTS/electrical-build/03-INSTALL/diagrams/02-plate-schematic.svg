<rect x="20.0" y="216.0" width="260.0" height="20.0" rx="0" class="box" />
<text x="28.0" y="230.0" class="t" >F3  5 A → L3-S2 2 switch supply · sense-stage rails</text>
<rect x="20.0" y="236.0" width="260.0" height="20.0" rx="0" class="box" />
