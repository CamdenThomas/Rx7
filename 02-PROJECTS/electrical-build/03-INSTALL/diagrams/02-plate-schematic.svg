<text x="48.0" y="100.0" class="w" font-weight="700">ALWAYS-HOT BUSBAR</text>
<text x="40.0" y="128.0" class="s" >← DP-BAT, 2 AWG from the Class-T</text>
<path d="M 260.0 95.0 L 420.0 95.0" class="pwr"/>
