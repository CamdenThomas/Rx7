<rect x="630.0" y="216.0" width="260.0" height="20.0" rx="0" class="box" />
<text x="638.0" y="230.0" class="t" >F7  10 A → K2 30</text>
<rect x="630.0" y="236.0" width="260.0" height="20.0" rx="0" class="box" />
<text x="638.0" y="250.0" class="t" >spare</text>
