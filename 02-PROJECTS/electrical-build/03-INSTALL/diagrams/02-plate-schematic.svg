<text x="20" y="30" font-size="18" class="h">The plate — every sub-circuit on the removable backer</text>
<text x="20" y="48" class="d">Busbar, four single-source fuse blocks, four relays, the wake strip, the two sense stages, the bias resistors, the ground bus</text>
