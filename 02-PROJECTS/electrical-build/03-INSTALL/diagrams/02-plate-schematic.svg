<text x="895.0" y="375.0" class="s" >87a</text>
<path d="M 674.0 330.0 L 650.0 330.0 L 650.0 450.0 L 600.0 450.0" class="blu"/>
<text x="430.0" y="454.0" class="s" >K1 85 → L3-S1 10 (wink R NC → gnd)</text>
<path d="M 866.0 340.0 L 890.0 340.0 L 890.0 460.0 L 930.0 460.0" class="blu"/>
<text x="932.0" y="464.0" class="s" >K2 85 → L3-S1 9 (wink L NC → gnd)</text>
<text x="600.0" y="500.0" class="d" >Both coils share O1. A held wink switch opens the OTHER relay&#x27;s coil return,</text>
<text x="600.0" y="514.0" class="d" >so only the winked lamp cycles.</text>
<text x="1080.0" y="150.0" class="h" >O15 (pin 27) · 12 AWG RED/VIO</text>
<path d="M 1080.0 156.0 L 1210.0 156.0 L 1210.0 170.0" class="pwr2"/>
