<rect x="1080.0" y="196.0" width="260.0" height="20.0" rx="0" class="box" />
<text x="1088.0" y="210.0" class="t" >F10 — empty</text>
<rect x="1080.0" y="216.0" width="260.0" height="20.0" rx="0" class="box" />
<text x="1088.0" y="230.0" class="t" >F11 — empty</text>
<rect x="1080.0" y="236.0" width="260.0" height="20.0" rx="0" class="box" />
<text x="1088.0" y="250.0" class="t" >spare</text>
<rect x="1080.0" y="256.0" width="260.0" height="20.0" rx="0" class="box" />
<text x="1088.0" y="270.0" class="t" >spare</text>
<text x="1080.0" y="290.0" class="s" >Block D input also feeds L3-P 2 (capped)</text>
<text x="1080.0" y="330.0" class="h" >SEALED INLINES</text>
<text x="1080.0" y="350.0" class="t" >O12 (pin 2) ─ F15 7.5 A ─→ L1-S1 2  alternator excitation</text>
<text x="1080.0" y="368.0" class="t" >O12 (pin 2) ─ F16 5 A ───→ DP-CLU 1  cluster feed</text>
<text x="1080.0" y="386.0" class="t" >O20 (pin 34) ─ F12 5 A ──→ L4-M 8   interior lamp</text>
<text x="1080.0" y="430.0" class="h" >K12 WASHER RELAY</text>
<rect x="1154.0" y="468.0" width="52.0" height="44.0" rx="3" class="box" />
<text x="1180.0" y="482.0" class="h" text-anchor="middle">K12</text>
<text x="1180.0" y="496.0" class="s" text-anchor="middle">washer</text>
<path d="M 1154.0 480.0 L 1090.0 480.0" class="org"/>
<text x="1000.0" y="476.0" class="s" >30 ← O8 (pin 9)</text>
<path d="M 1206.0 480.0 L 1290.0 480.0" class="org"/>
<text x="1292.0" y="476.0" class="s" >87 → L2-M 4 pump</text>
<path d="M 1154.0 500.0 L 1090.0 500.0" class="org"/>
<text x="990.0" y="516.0" class="s" >86 ← O10 (pin 4)</text>
<path d="M 1206.0 500.0 L 1290.0 500.0" class="blu"/>
<text x="1292.0" y="516.0" class="s" >85 → L3-S2 9 (stalk WASH → gnd)</text>
<rect x="40.0" y="560.0" width="520.0" height="26.0" rx="3" class="hdr" />
<text x="48.0" y="577.0" class="w" font-weight="700">WAKE STRIP — 8-pos barrier strip, 5 used, one 1N5819 per input, band → pin 7</text>
<rect x="40.0" y="586.0" width="520.0" height="20.0" rx="0" class="box" />
<text x="48.0" y="600.0" class="t" >1  ACC  ← L3-S1 12 (ignition switch ACC, raw 12 V)</text>
<rect x="40.0" y="606.0" width="520.0" height="20.0" rx="0" class="box" />
<text x="48.0" y="620.0" class="t" >2  RUN  ← L3-S2 1 (ignition switch IG, raw 12 V)</text>
<rect x="40.0" y="626.0" width="520.0" height="20.0" rx="0" class="box" />
<text x="48.0" y="640.0" class="t" >3  DOOR ← sense stage 1 collector (A6 node)</text>
<rect x="40.0" y="646.0" width="520.0" height="20.0" rx="0" class="box" />
<text x="48.0" y="660.0" class="t" >4  A8   ← sense stage 2 collector (hazard · horn · wink)</text>
<rect x="40.0" y="666.0" width="520.0" height="20.0" rx="0" class="box" />
<text x="48.0" y="680.0" class="t" >5  LATCH ← O22 (pin 8)</text>
<rect x="40.0" y="686.0" width="520.0" height="20.0" rx="0" class="box" />
<text x="48.0" y="700.0" class="t" >6–8  spare</text>
<path d="M 560.0 596.0 L 620.0 596.0 L 620.0 700.0 L 700.0 700.0" class="blu"/>
<rect x="700.0" y="680.0" width="200.0" height="40.0" rx="0" class="box" />
<text x="708.0" y="696.0" class="h" >PMU PIN 7  +12V SW</text>
<text x="708.0" y="710.0" class="t" >10 kΩ bleed to the GND bus</text>
<rect x="940.0" y="560.0" width="540.0" height="26.0" rx="3" class="hdr" />
<text x="948.0" y="577.0" class="w" font-weight="700">SENSE STAGE (×2) — NPN 2N3904, one on A6, one on A8</text>
<rect x="940.0" y="586.0" width="540.0" height="20.0" rx="0" class="box" />
<text x="948.0" y="600.0" class="t" >node ──100 kΩ──▶ base        1 MΩ from the node up to the F3 rail</text>
<rect x="940.0" y="606.0" width="540.0" height="20.0" rx="0" class="box" />
<text x="948.0" y="620.0" class="t" >emitter ──▶ GND bus</text>
<rect x="940.0" y="626.0" width="540.0" height="20.0" rx="0" class="box" />
<text x="948.0" y="640.0" class="t" >collector ──100 kΩ──▶ F3 rail ;  collector ──▶ its wake-strip input</text>
<rect x="940.0" y="646.0" width="540.0" height="20.0" rx="0" class="box" />
<text x="948.0" y="660.0" class="t" >Switch open: node 4–12 V → transistor ON → collector LOW → no wake</text>
<rect x="940.0" y="666.0" width="540.0" height="20.0" rx="0" class="box" />
<text x="948.0" y="680.0" class="t" >Switch closed to ground: base falls → transistor OFF → collector 12 V → WAKE</text>
<text x="940.0" y="720.0" class="t" >BIAS: pin 15 (+5 V) ──100 kΩ──▶ pin 35 (A15) and ──100 kΩ──▶ pin 22 (A16)</text>
<text x="940.0" y="738.0" class="t" >A15 / A16 configured 10 kΩ pull-DOWN · A1–A6, A8 10 kΩ pull-UP · A7 1 MΩ pull-DOWN</text>
<text x="940.0" y="756.0" class="t" >CAN1: 120 Ω across pins 23/36 at the connector · CAN2: software termination ON</text>
<rect x="40.0" y="780.0" width="520.0" height="30.0" rx="3" class="hdr" />
<text x="48.0" y="800.0" class="w" font-weight="700">GROUND BUS (DP-GND)</text>
<text x="40.0" y="830.0" class="t" >← PMU pin 25, 10 AWG, ≤ 6 in   ·   → chassis dash star, 10 AWG</text>
<text x="40.0" y="848.0" class="t" >← K1 87a · K2 87a · K11 85 · sense-stage emitters · bleed resistor · tach shield (this end only)</text>
<text x="40.0" y="866.0" class="t" >→ DP-CLU 2 · DP-DIAG 4 · DP-ICU 2 · DP-DCU 3 · DP-KEY 4 · L3-S2 8  (the only grounds that cross a connector — all box-adjacent)</text>
<text x="40.0" y="910.0" class="d" >Splices at the post (inside the box, never in a leg): A3 = L3-S1 5 + L2-S 3 · A4 = L2-S 1 + L1-S1 11 · A5 = L2-S 2 + L1-S2 7 · A8 = L3-S1 6 + L3-S1 11</text>
<text x="40.0" y="928.0" class="d" >Sensor pass-throughs: L1-S1 3 → DP-CLU 5 · L1-S1 4 → DP-CLU 6 · L1-S1 6 → DP-CLU 4 · L1-S2 8 → DP-CLU 8 · L1-S2 1 + L3-S2 11 → DP-CLU 9 · L4-S 1 → DP-CLU 7 (+ A7 tap)</text>
<text x="40.0" y="946.0" class="d" >Shared outputs: O17 → L2-M 5 + L4-M 5 + DP-CLU 10 · O18 → L2-M 6 + L4-M 6 + DP-CLU 11 · O6 → L2-M 7 + L4-M 1 · O3 → L2-P1 2 + DP-CLU 12 (16 AWG tap) · O20 → F12 + L3-S1 8 + DP-CLU 3</text>
</svg>