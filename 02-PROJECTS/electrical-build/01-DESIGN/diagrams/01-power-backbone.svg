<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="740" viewBox="0 0 1300 740" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11">
<style>
.t{fill:#1b1b1b}.d{fill:#5d6d7e}.h{font-weight:700;fill:#1b1b1b}.w{fill:#fff}
.box{fill:#fff;stroke:#1b1b1b;stroke-width:1.2}
.zone{fill:#f4f6f6;stroke:#5d6d7e;stroke-width:1;stroke-dasharray:4 3}
.hdr{fill:#1b1b1b}
.pwr{stroke:#c0392b;stroke-width:3;fill:none}
.pwr2{stroke:#c0392b;stroke-width:1.8;fill:none}
.sig{stroke:#1b1b1b;stroke-width:1.3;fill:none}
.cap{stroke:#7f8c8d;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
.gnd{stroke:#7f8c8d;stroke-width:1.4;fill:none}
.can{stroke:#1f77b4;stroke-width:1.4;fill:none;stroke-dasharray:6 3}
.blu{stroke:#1f77b4;stroke-width:1.3;fill:none}
.org{stroke:#e67e22;stroke-width:1.6;fill:none}
.vio{stroke:#8e44ad;stroke-width:1.3;fill:none}
.gry{stroke:#7f8c8d;stroke-width:1.2;fill:none}
.pnk{stroke:#e84393;stroke-width:1.2;fill:none}
.red{stroke:#c0392b;stroke-width:1.6;fill:none}
.s{font-size:10;fill:#5d6d7e}.b{fill:#1f77b4}.r{fill:#c0392b}
.mono{font-family:ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace}
</style>
<rect width="1300" height="740" fill="#fbfbf9"/>
<text x="20" y="30" font-size="18" class="h">Power backbone</text>
<text x="20" y="48" class="d">Battery in the cargo bin · two separate runs off the post · nothing here passes through the PMU</text>
<rect x="40.0" y="90.0" width="200.0" height="120.0" rx="0" class="box" />
<text x="48.0" y="106.0" class="h" >Ionic S9 lithium</text>
<text x="48.0" y="120.0" class="t" >40 Ah · 1,100 CCA · heated</text>
<text x="48.0" y="133.0" class="t" >Cargo bin, hold-down in every axis</text>
<text x="48.0" y="146.0" class="t" >Group 25 case in the NOCO BG27 box</text>
<text x="250.0" y="110.0" class="h" font-size="16">+</text>
<text x="250.0" y="200.0" class="h" font-size="16">−</text>
<path d="M 240.0 110.0 L 330.0 110.0" class="pwr"/>
<rect x="330.0" y="90.0" width="130.0" height="40.0" rx="0" class="box" />
<text x="338.0" y="106.0" class="h" >MASTER</text>
<text x="338.0" y="120.0" class="t" >disconnect</text>
<path d="M 460.0 110.0 L 540.0 110.0" class="pwr"/>
<rect x="540.0" y="90.0" width="140.0" height="40.0" rx="0" class="box" />
<text x="548.0" y="106.0" class="h" >CLASS-T 150 A</text>
<text x="548.0" y="120.0" class="t" >Blue Sea 5007100</text>
<path d="M 680.0 110.0 L 900.0 110.0" class="pwr"/>
<text x="690.0" y="100.0" class="s" >2 AWG RED · through the tunnel · pull string beside it</text>
<rect x="900.0" y="80.0" width="360.0" height="60.0" rx="0" class="box" />
<text x="908.0" y="96.0" class="h" >DASH POST — always-hot busbar</text>
<text x="908.0" y="110.0" class="t" >DP-BAT lug → busbar → 4 AWG → PMU stud (150 A max)</text>
<text x="908.0" y="123.0" class="t" >Fuse blocks A and K11 hang off this busbar</text>
<path d="M 240.0 110.0 L 280.0 110.0 L 280.0 300.0 L 330.0 300.0" class="pwr"/>
<rect x="330.0" y="280.0" width="130.0" height="40.0" rx="0" class="box" />
<text x="338.0" y="296.0" class="h" >MRBF 200 A</text>
<text x="338.0" y="310.0" class="t" >on the + post</text>
<path d="M 460.0 300.0 L 900.0 300.0" class="pwr"/>
<text x="470.0" y="290.0" class="s" >1/0 (or 2 AWG) RED · starter run · never fused below cranking current</text>
<rect x="900.0" y="270.0" width="360.0" height="60.0" rx="0" class="box" />
<text x="908.0" y="286.0" class="h" >STARTER B+ STUD</text>
<text x="908.0" y="300.0" class="t" >Main terminal of the starting motor A-01</text>
<text x="908.0" y="313.0" class="t" >Also the tap point for the alternator and K9</text>
<rect x="1080.0" y="400.0" width="180.0" height="50.0" rx="0" class="box" />
<text x="1088.0" y="416.0" class="h" >ALTERNATOR B+</text>
<text x="1088.0" y="430.0" class="t" >A-09 ring</text>
<path d="M 1080.0 425.0 L 1000.0 425.0 L 1000.0 330.0" class="pwr2"/>
<rect x="986.0" y="364.0" width="28.0" height="12.0" rx="2" class="box" />
<line x1="986.0" y1="370.0" x2="1014.0" y2="370.0" class="sig"/>
<text x="1000.0" y="361.0" class="s" text-anchor="middle">F18 100 A MIDI</text>
<text x="1010.0" y="440.0" class="s" >6 AWG RED</text>
<rect x="694.0" y="403.0" width="52.0" height="44.0" rx="3" class="box" />
<text x="720.0" y="417.0" class="h" text-anchor="middle">K9</text>
<text x="720.0" y="431.0" class="s" text-anchor="middle">start relay</text>
<rect x="866.0" y="394.0" width="28.0" height="12.0" rx="2" class="box" />
<line x1="866.0" y1="400.0" x2="894.0" y2="400.0" class="sig"/>
<text x="880.0" y="391.0" class="s" text-anchor="middle">F17 30 A MIDI</text>
<path d="M 940.0 330.0 L 940.0 400.0 L 894.0 400.0" class="pwr2"/>
<path d="M 866.0 400.0 L 746.0 400.0" class="pwr2"/>
<text x="752.0" y="392.0" class="s" >30 · 10 AWG</text>
<path d="M 746.0 440.0 L 900.0 440.0 L 900.0 480.0" class="pwr2"/>
<rect x="860.0" y="480.0" width="140.0" height="40.0" rx="0" class="box" />
<text x="868.0" y="496.0" class="h" >STARTER S</text>
<text x="868.0" y="510.0" class="t" >solenoid, factory BW</text>
<text x="760.0" y="460.0" class="s" >87 · 10 AWG</text>
<path d="M 694.0 410.0 L 600.0 410.0" class="vio"/>
<text x="560.0" y="400.0" class="s" >86 ← O21 (L1-S1 1)</text>
<path d="M 694.0 440.0 L 640.0 440.0" class="gnd"/>
<line x1="640.0" y1="440.0" x2="640.0" y2="448.0" class="gnd"/>
<line x1="632.0" y1="448.0" x2="648.0" y2="448.0" class="gnd"/>
<line x1="635.0" y1="452.0" x2="645.0" y2="452.0" class="gnd"/>
<line x1="638.0" y1="456.0" x2="642.0" y2="456.0" class="gnd"/>
<text x="560.0" y="470.0" class="s" >85 → block</text>
<text x="660.0" y="480.0" class="s" >Inner fender, sealed relay</text>
<path d="M 240.0 200.0 L 330.0 200.0 L 330.0 560.0 L 420.0 560.0" class="gnd"/>
<text x="300.0" y="560.0" class="s" >2 AWG BLK</text>
<rect x="420.0" y="540.0" width="220.0" height="40.0" rx="0" class="box" />
<text x="428.0" y="556.0" class="h" >REAR GROUND STUD</text>
<text x="428.0" y="570.0" class="t" >bare metal · star washer · wax</text>
<line x1="530.0" y1="585.0" x2="530.0" y2="593.0" class="gnd"/>
<line x1="522.0" y1="593.0" x2="538.0" y2="593.0" class="gnd"/>
<line x1="525.0" y1="597.0" x2="535.0" y2="597.0" class="gnd"/>
<line x1="528.0" y1="601.0" x2="532.0" y2="601.0" class="gnd"/>
<rect x="700.0" y="540.0" width="260.0" height="40.0" rx="0" class="box" />
<text x="708.0" y="556.0" class="h" >ENGINE BLOCK → CHASSIS STRAP</text>
<text x="708.0" y="570.0" class="t" >2 AWG BLK · ≤ 24 in · cranking return</text>
<path d="M 640.0 560.0 L 700.0 560.0" class="gnd"/>
<text x="40.0" y="690.0" class="d" >Rule: the disconnect and the Class-T sit in the PMU run only. Killing the disconnect isolates the whole electrical system while the starter cable stays passive.</text>
<text x="40.0" y="708.0" class="d" >Rule: the Class-T mounts as close to battery + as physically possible — the cable between post and fuse is the one length that can never be protected.</text>
</svg>