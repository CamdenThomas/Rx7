<line x1="442.0" y1="408.0" x2="458.0" y2="408.0" class="gnd"/>
<line x1="445.0" y1="412.0" x2="455.0" y2="412.0" class="gnd"/>
<line x1="448.0" y1="416.0" x2="452.0" y2="416.0" class="gnd"/>
