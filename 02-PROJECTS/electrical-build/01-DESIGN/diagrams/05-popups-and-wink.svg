<text x="50.0" y="296.0" class="s" >86 ← O1</text>
<path d="M 40.0 300.0 L 40.0 330.0 L 494.0 330.0 L 494.0 224.0" class="red"/>
<text x="400.0" y="326.0" class="s" >86 ← O1</text>
