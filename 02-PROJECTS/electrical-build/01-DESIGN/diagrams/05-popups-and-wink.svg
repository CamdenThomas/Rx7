<text x="20" y="30" font-size="18" class="h">Pop-up headlights and wink</text>
<text x="20" y="48" class="d">Single-direction cam motors · one relay per side · both relays share O1 · a held wink switch blocks the other side</text>
<text x="40.0" y="80.0" class="h" >O1 MOTOR BUS (pin 38, 25 A, integrated flyback)</text>
