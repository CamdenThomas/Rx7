<text x="550.0" y="440.0" class="s" >85 → L3-S1 9</text>
<rect x="620.0" y="445.0" width="130.0" height="30.0" rx="3" class="box" />
<text x="685.0" y="458.0" class="s" text-anchor="middle">WINK L  NC pole</text>
<text x="685.0" y="470.0" class="s" text-anchor="middle">common → ground</text>
<path d="M 750.0 460.0 L 770.0 460.0" class="gnd"/>
<line x1="770.0" y1="460.0" x2="770.0" y2="468.0" class="gnd"/>
<line x1="762.0" y1="468.0" x2="778.0" y2="468.0" class="gnd"/>
<line x1="765.0" y1="472.0" x2="775.0" y2="472.0" class="gnd"/>
<line x1="768.0" y1="476.0" x2="772.0" y2="476.0" class="gnd"/>
<text x="820.0" y="100.0" class="h" >HOW IT WORKS</text>
<text x="820.0" y="122.0" class="t" >Raise and lower are the same act: the motor runs one half-turn of its crank and its own cam</text>
<text x="820.0" y="142.0" class="t" >opens the run feed at the end.</text>
<text x="820.0" y="162.0" class="t" >O1 on → both coils energise → both lamps cycle. The PMU holds O1 until both YG transit</text>
<text x="820.0" y="182.0" class="t" >contacts (A4 / A5) open; 4 s still closed = obstruction fault.</text>
<text x="820.0" y="202.0" class="t" >Wink: press wink L. Its NO pole pulls the A8 node low through 18 kΩ (wake + WINK_L read).</text>
<text x="820.0" y="222.0" class="t" >Its NC pole opens K2&#x27;s coil return. The PMU runs the cycle on O1 — K1 pulls in, K2 cannot.</text>
<text x="820.0" y="242.0" class="t" >Only the left lamp moves. Works with the key out: sense stage 2 wakes the PMU.</text>
<text x="820.0" y="262.0" class="t" >87a to ground gives dynamic braking at rest for free.</text>
<text x="820.0" y="282.0" class="t" >Transit sense: motor terminal YG → 3.3 kΩ → L2-S 1/2, with a 47 kΩ baseline to ground at the</text>
<text x="820.0" y="302.0" class="t" >connector; the inhibitor contacts splice onto the same nodes at the post.</text>
<text x="820.0" y="360.0" class="d" >Which motor terminals carry the run feed (R, RY, or both bridged) is settled by the</text>
<text x="820.0" y="376.0" class="d" >ohm check the build performs first.</text>
</svg>