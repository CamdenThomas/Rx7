<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="520" viewBox="0 0 1300 520" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11">
<style>
.t{fill:#1b1b1b}.d{fill:#5d6d7e}.h{font-weight:700;fill:#1b1b1b}.w{fill:#fff}
.box{fill:#fff;stroke:#1b1b1b;stroke-width:1.2}
.zone{fill:#f4f6f6;stroke:#5d6d7e;stroke-width:1;stroke-dasharray:4 3}
.hdr{fill:#1b1b1b}
.pwr{stroke:#c0392b;stroke-width:3;fill:none}
.pwr2{stroke:#c0392b;stroke-width:1.8;fill:none}
.sig{stroke:#1b1b1b;stroke-width:1.3;fill:none}
.cap{stroke:#7f8c8d;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
.gnd{stroke:#7f8c8d;stroke-width:1.4;fill:none}
.can{stroke:#1f77b4;stroke-width:1.4;fill:none;stroke-dasharray:6 3}
.blu{stroke:#1f77b4;stroke-width:1.3;fill:none}
.org{stroke:#e67e22;stroke-width:1.6;fill:none}
.vio{stroke:#8e44ad;stroke-width:1.3;fill:none}
.gry{stroke:#7f8c8d;stroke-width:1.2;fill:none}
.pnk{stroke:#e84393;stroke-width:1.2;fill:none}
.red{stroke:#c0392b;stroke-width:1.6;fill:none}
.s{font-size:10;fill:#5d6d7e}.b{fill:#1f77b4}.r{fill:#c0392b}
.mono{font-family:ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace}
</style>
<rect width="1300" height="520" fill="#fbfbf9"/>
<text x="20" y="30" font-size="18" class="h">DP-CLU — the factory cluster stays, fed from day one</text>
<text x="20" y="48" class="d">One DT-12 drop at the post · the cluster&#x27;s own plug is kept as a pigtail</text>
<rect x="40.0" y="80.0" width="620.0" height="26.0" rx="3" class="hdr" />
<text x="48.0" y="97.0" class="w" font-weight="700">DP-CLU · DT06-12S → DT04-12P · 12 cavities · dash post</text>
<rect x="40.0" y="106.0" width="620.0" height="24.0" rx="0" class="box" />
<text x="48.0" y="122.0" class="h" >1</text>
<text x="70.0" y="122.0" class="t" >Cluster IG feed</text>
<text x="330.0" y="122.0" class="d" >F16 (5 A) ← O12</text>
<text x="560.0" y="122.0" class="b" >16 RED</text>
<text x="700.0" y="122.0" class="t" >Cluster plug — factory GY (ignition feed to the gauges and lamps)</text>
<rect x="40.0" y="130.0" width="620.0" height="24.0" rx="0" class="box" />
<text x="48.0" y="146.0" class="h" >2</text>
<text x="70.0" y="146.0" class="t" >Cluster ground</text>
<text x="330.0" y="146.0" class="d" >DP-GND</text>
<text x="560.0" y="146.0" class="b" >16 BLK</text>
<text x="700.0" y="146.0" class="t" >Cluster plug — factory B</text>
<rect x="40.0" y="154.0" width="620.0" height="24.0" rx="0" class="box" />
<text x="48.0" y="170.0" class="h" >3</text>
<text x="70.0" y="170.0" class="t" >Cluster illumination</text>
<text x="330.0" y="170.0" class="d" >O20 (pin 34)</text>
<text x="560.0" y="170.0" class="b" >16 RED</text>
<text x="700.0" y="170.0" class="t" >Cluster plug — factory RL</text>
<rect x="40.0" y="178.0" width="620.0" height="24.0" rx="0" class="box" />
<text x="48.0" y="194.0" class="h" >4</text>
<text x="70.0" y="194.0" class="t" >Tachometer</text>
<text x="330.0" y="194.0" class="d" >← L1-S1 6 (shielded)</text>
<text x="560.0" y="194.0" class="b" >16 sh shielded</text>
<text x="700.0" y="194.0" class="t" >Cluster plug — factory YG</text>
<rect x="40.0" y="202.0" width="620.0" height="24.0" rx="0" class="box" />
<text x="48.0" y="218.0" class="h" >5</text>
<text x="70.0" y="218.0" class="t" >Water temp gauge</text>
<text x="330.0" y="218.0" class="d" >← L1-S1 3</text>
<text x="560.0" y="218.0" class="b" >16 GRY</text>
<text x="700.0" y="218.0" class="t" >Cluster plug — factory YW</text>
<rect x="40.0" y="226.0" width="620.0" height="24.0" rx="0" class="box" />
<text x="48.0" y="242.0" class="h" >6</text>
<text x="70.0" y="242.0" class="t" >Oil pressure gauge</text>
<text x="330.0" y="242.0" class="d" >← L1-S1 4</text>
<text x="560.0" y="242.0" class="b" >16 GRY</text>
<text x="700.0" y="242.0" class="t" >Cluster plug — factory BrY</text>
<rect x="40.0" y="250.0" width="620.0" height="24.0" rx="0" class="box" />
<text x="48.0" y="266.0" class="h" >7</text>
<text x="70.0" y="266.0" class="t" >Fuel gauge</text>
<text x="330.0" y="266.0" class="d" >← L4-S 1 (A7 taps this conductor)</text>
<text x="560.0" y="266.0" class="b" >16 GRY</text>
<text x="700.0" y="266.0" class="t" >Cluster plug — factory Y</text>
<rect x="40.0" y="274.0" width="620.0" height="24.0" rx="0" class="box" />
<text x="48.0" y="290.0" class="h" >8</text>
<text x="70.0" y="290.0" class="t" >Charge warning lamp</text>
<text x="330.0" y="290.0" class="d" >← L1-S2 8</text>
<text x="560.0" y="290.0" class="b" >16 GRY</text>
<text x="700.0" y="290.0" class="t" >Cluster plug — the charge-lamp terminal (identify at the cluster plug)</text>
<rect x="40.0" y="298.0" width="620.0" height="24.0" rx="0" class="box" />
<text x="48.0" y="314.0" class="h" >9</text>
<text x="70.0" y="314.0" class="t" >Brake warning lamp</text>
<text x="330.0" y="314.0" class="d" >← L1-S2 1 + L3-S2 11</text>
<text x="560.0" y="314.0" class="b" >16 GRY</text>
<text x="700.0" y="314.0" class="t" >Cluster plug — factory BR</text>
<rect x="40.0" y="322.0" width="620.0" height="24.0" rx="0" class="box" />
<text x="48.0" y="338.0" class="h" >10</text>
<text x="70.0" y="338.0" class="t" >Turn LEFT indicator</text>
<text x="330.0" y="338.0" class="d" >O17 (pin 6)</text>
<text x="560.0" y="338.0" class="b" >16 RED</text>
<text x="700.0" y="338.0" class="t" >Cluster plug — factory GR</text>
<rect x="40.0" y="346.0" width="620.0" height="24.0" rx="0" class="box" />
<text x="48.0" y="362.0" class="h" >11</text>
<text x="70.0" y="362.0" class="t" >Turn RIGHT indicator</text>
<text x="330.0" y="362.0" class="d" >O18 (pin 33)</text>
<text x="560.0" y="362.0" class="b" >16 RED</text>
<text x="700.0" y="362.0" class="t" >Cluster plug — factory GO</text>
<rect x="40.0" y="370.0" width="620.0" height="24.0" rx="0" class="box" />
<text x="48.0" y="386.0" class="h" >12</text>
<text x="70.0" y="386.0" class="t" >High-beam indicator</text>
<text x="330.0" y="386.0" class="d" >O3 (pin 26), 16 AWG tap</text>
<text x="560.0" y="386.0" class="b" >16 RED</text>
<text x="700.0" y="386.0" class="t" >Cluster plug — factory RY</text>
<text x="700.0" y="97.0" class="h" >CLUSTER PLUG — factory wire at the cluster</text>
<text x="40.0" y="420.0" class="d" >Fuel: the factory gauge drives the sender as it always has. The PMU&#x27;s A7 only taps the same wire (1 MΩ pull-down, no pull-up) and is calibrated in the car; if the reading is unusable, A7 is simply left unused.</text>
<text x="40.0" y="438.0" class="d" >Brake warning: the fluid-level switch (engine bay) and the parking-brake switch (dash) both pull DP-CLU 9 to ground — either lights the lamp. No checker module.</text>
<text x="40.0" y="456.0" class="d" >Charge lamp: the alternator&#x27;s WB terminal sits low until the alternator spins up, then rises — the lamp is between DP-CLU 8 and the cluster&#x27;s IG feed, exactly as an L-terminal lamp works. Confirm at first start.</text>
<text x="40.0" y="474.0" class="d" >Speedometer is a mechanical cable and needs nothing. Turn, high-beam and illumination come straight off the PMU outputs. The retractor indicator lamp is not used.</text>
</svg>