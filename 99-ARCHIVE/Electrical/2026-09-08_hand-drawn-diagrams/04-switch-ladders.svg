<rect width="1500" height="700" fill="#fbfbf9"/>
<text x="20" y="30" font-size="18" class="h">How the switches are read</text>
<text x="20" y="48" class="d">Ground ladders on A1–A8 · 12 V summed ladders on A15 / A16 · the WASH diode leg · the washer relay · the sense stage that wakes the PMU</text>
<text x="40.0" y="80.0" class="h" >GROUND LADDER (A1 A2 A3 A6 A8, and A4/A5)</text>
<text x="40.0" y="98.0" class="s" >PMU input, 10 kΩ pull-up to +5 V inside the PMU</text>
<path d="M 40.0 130.0 L 300.0 130.0" class="gry"/>
<text x="40.0" y="124.0" class="s" >one wire to the PMU</text>
<path d="M 120.0 130.0 L 120.0 160.0" class="sig"/>
<rect x="116.0" y="163.0" width="8.0" height="24.0" rx="1" class="box" />
<text x="128.0" y="178.0" class="s" >1.8k</text>
<path d="M 120.0 187.0 L 120.0 210.0" class="sig"/>
<rect x="106.0" y="210.0" width="28.0" height="14.0" rx="2" class="box" />
<text x="120.0" y="221.0" class="s" text-anchor="middle">LEFT</text>
<path d="M 120.0 224.0 L 120.0 240.0" class="sig"/>
<line x1="120.0" y1="240.0" x2="120.0" y2="248.0" class="gnd"/>
<line x1="112.0" y1="248.0" x2="128.0" y2="248.0" class="gnd"/>
<line x1="115.0" y1="252.0" x2="125.0" y2="252.0" class="gnd"/>
<line x1="118.0" y1="256.0" x2="122.0" y2="256.0" class="gnd"/>
<path d="M 190.0 130.0 L 190.0 160.0" class="sig"/>
<rect x="186.0" y="163.0" width="8.0" height="24.0" rx="1" class="box" />
<text x="198.0" y="178.0" class="s" >10k</text>
<path d="M 190.0 187.0 L 190.0 210.0" class="sig"/>
<rect x="176.0" y="210.0" width="28.0" height="14.0" rx="2" class="box" />
<text x="190.0" y="221.0" class="s" text-anchor="middle">RIGHT</text>
<path d="M 190.0 224.0 L 190.0 240.0" class="sig"/>
<line x1="190.0" y1="240.0" x2="190.0" y2="248.0" class="gnd"/>
<line x1="182.0" y1="248.0" x2="198.0" y2="248.0" class="gnd"/>
<line x1="185.0" y1="252.0" x2="195.0" y2="252.0" class="gnd"/>
<line x1="188.0" y1="256.0" x2="192.0" y2="256.0" class="gnd"/>
<path d="M 260.0 130.0 L 260.0 160.0" class="sig"/>
<rect x="256.0" y="163.0" width="8.0" height="24.0" rx="1" class="box" />
<text x="268.0" y="178.0" class="s" >47k</text>
<path d="M 260.0 187.0 L 260.0 210.0" class="sig"/>
<rect x="246.0" y="210.0" width="28.0" height="14.0" rx="2" class="box" />
<text x="260.0" y="221.0" class="s" text-anchor="middle">OFF</text>
<path d="M 260.0 224.0 L 260.0 240.0" class="sig"/>
<line x1="260.0" y1="240.0" x2="260.0" y2="248.0" class="gnd"/>
<line x1="252.0" y1="248.0" x2="268.0" y2="248.0" class="gnd"/>
<line x1="255.0" y1="252.0" x2="265.0" y2="252.0" class="gnd"/>
<line x1="258.0" y1="256.0" x2="262.0" y2="256.0" class="gnd"/>
<text x="40.0" y="290.0" class="d" >count = 1023 × R / (R + 10 000). Open wire = 1023 = FAULT. Short = 0 = FAULT.</text>
<text x="40.0" y="306.0" class="d" >Every real state sits between. Resistors live AT THE SWITCH, heat-shrunk individually.</text>
<text x="40.0" y="322.0" class="d" >A4 / A5 add a 47 kΩ baseline at the connector so &#x27;idle&#x27; is not &#x27;open&#x27;.</text>
<text x="40.0" y="370.0" class="h" >WASH LEG ON A2 + WASHER RELAY K12</text>
<path d="M 40.0 410.0 L 200.0 410.0" class="gry"/>
<text x="40.0" y="404.0" class="s" >A2 wire</text>
<path d="M 200.0 410.0 L 200.0 430.0" class="sig"/>
<rect x="196.0" y="433.0" width="8.0" height="24.0" rx="1" class="box" />
<text x="208.0" y="448.0" class="s" >1.8k</text>
<path d="M 200.0 457.0 L 200.0 475.0" class="sig"/>
<path d="M 195.0 476.0 L 205.0 476.0 L 200.0 487.0 Z" class="sig"/>
<line x1="195.0" y1="487.0" x2="205.0" y2="487.0" class="sig"/>
<path d="M 200.0 488.0 L 200.0 510.0" class="sig"/>
<rect x="186.0" y="510.0" width="28.0" height="14.0" rx="2" class="box" />
<text x="200.0" y="521.0" class="s" text-anchor="middle">WASH</text>
<path d="M 200.0 524.0 L 200.0 540.0" class="sig"/>
<line x1="200.0" y1="540.0" x2="200.0" y2="548.0" class="gnd"/>
<line x1="192.0" y1="548.0" x2="208.0" y2="548.0" class="gnd"/>
<line x1="195.0" y1="552.0" x2="205.0" y2="552.0" class="gnd"/>
<line x1="198.0" y1="556.0" x2="202.0" y2="556.0" class="gnd"/>
<path d="M 200.0 510.0 L 330.0 510.0" class="blu"/>
<text x="240.0" y="504.0" class="s" >L3-S2 9 → K12 85</text>
<rect x="354.0" y="468.0" width="52.0" height="44.0" rx="3" class="box" />
<text x="380.0" y="482.0" class="h" text-anchor="middle">K12</text>
<text x="380.0" y="496.0" class="s" text-anchor="middle">washer</text>
<path d="M 380.0 468.0 L 380.0 440.0 L 460.0 440.0" class="org"/>
<text x="462.0" y="444.0" class="s" >86 ← O10 accessory</text>
<path d="M 406.0 500.0 L 480.0 500.0" class="org"/>
<text x="482.0" y="504.0" class="s" >30 ← O8 wiper LOW</text>
<path d="M 406.0 480.0 L 480.0 480.0 L 480.0 462.0" class="org"/>
<text x="482.0" y="470.0" class="s" >87 → L2-M 4 pump</text>
<text x="40.0" y="590.0" class="d" >Contact open: K12 85 sits at +12 V through the coil, the diode blocks, A2 reads the rotary position.</text>
<text x="40.0" y="606.0" class="d" >Contact closed: coil → ground (K12 pulls in), A2 reads WASH (208). The PMU sees WASH and turns O8 on,</text>
<text x="40.0" y="622.0" class="d" >K12 passes O8 to the pump. Release: the pump stops at once, the wipers finish two sweeps.</text>
<text x="760.0" y="80.0" class="h" >12 V SUMMED LADDER (A15 headlight · A16 key)</text>
<text x="760.0" y="98.0" class="s" >PMU input configured 10 kΩ pull-DOWN · 100 kΩ bias from +5 V on the dash node</text>
<path d="M 760.0 130.0 L 1060.0 130.0" class="gry"/>
<text x="1070.0" y="134.0" class="s" >→ A16</text>
<rect x="804.0" y="160.0" width="32.0" height="14.0" rx="2" class="box" />
<text x="820.0" y="171.0" class="s" text-anchor="middle">ACC</text>
<path d="M 820.0 160.0 L 820.0 150.0" class="sig"/>
<rect x="816.0" y="133.0" width="8.0" height="24.0" rx="1" class="box" />
<text x="828.0" y="148.0" class="s" >33k</text>
<path d="M 820.0 133.0 L 820.0 130.0" class="sig"/>
<path d="M 820.0 174.0 L 820.0 195.0" class="pnk"/>
<rect x="884.0" y="160.0" width="32.0" height="14.0" rx="2" class="box" />
<text x="900.0" y="171.0" class="s" text-anchor="middle">IG</text>
<path d="M 900.0 160.0 L 900.0 150.0" class="sig"/>
<rect x="896.0" y="133.0" width="8.0" height="24.0" rx="1" class="box" />
<text x="908.0" y="148.0" class="s" >15k</text>
<path d="M 900.0 133.0 L 900.0 130.0" class="sig"/>
<path d="M 900.0 174.0 L 900.0 195.0" class="pnk"/>
<rect x="964.0" y="160.0" width="32.0" height="14.0" rx="2" class="box" />
<text x="980.0" y="171.0" class="s" text-anchor="middle">ST</text>
<path d="M 980.0 160.0 L 980.0 150.0" class="sig"/>
<rect x="976.0" y="133.0" width="8.0" height="24.0" rx="1" class="box" />
<text x="988.0" y="148.0" class="s" >6.8k</text>
<path d="M 980.0 133.0 L 980.0 130.0" class="sig"/>
<path d="M 980.0 174.0 L 980.0 195.0" class="pnk"/>
<path d="M 820.0 195.0 L 980.0 195.0 L 980.0 210.0" class="pnk"/>
<rect x="930.0" y="210.0" width="100.0" height="16.0" rx="2" class="box" />
<text x="980.0" y="222.0" class="s" text-anchor="middle">switch B ← F3</text>
<text x="760.0" y="260.0" class="d" >Several contacts can be live at once (ACC stays live in RUN). Each contact feeds the node through</text>
<text x="760.0" y="276.0" class="d" >its own resistor; the decode table lists the COMBINATIONS, not the contacts.</text>
<text x="760.0" y="292.0" class="d" >A15 is the same: PARK 33k · HEAD 15k · DIMMER-HI 8.2k (fed from the HEAD side) · PASS 3.3k.</text>
<text x="760.0" y="340.0" class="h" >SENSE STAGE — how a ground closure wakes the PMU (one on A6, one on A8)</text>
<path d="M 1010.0 372.0 L 1010.0 372.0" class="pnk"/>
<path d="M 880.0 380.0 L 880.0 372.0 L 1210.0 372.0" class="pnk"/>
<text x="1215.0" y="376.0" class="s" >F3 rail (+12 V always)</text>
<path d="M 760.0 430.0 L 880.0 430.0" class="gry"/>
<text x="760.0" y="424.0" class="s" >ladder node</text>
<path d="M 880.0 430.0 L 880.0 392.0" class="sig"/>
<rect x="876.0" y="372.0" width="8.0" height="24.0" rx="1" class="box" />
<text x="888.0" y="387.0" class="s" >1M</text>
<rect x="908.0" y="426.0" width="24.0" height="8.0" rx="1" class="box" />
<text x="920.0" y="423.0" class="s" text-anchor="middle">100k</text>
<path d="M 892.0 430.0 L 908.0 430.0" class="sig"/>
<path d="M 932.0 430.0 L 960.0 430.0" class="sig"/>
<rect x="960.0" y="410.0" width="40.0" height="40.0" rx="4" class="box" />
<text x="980.0" y="434.0" class="s" text-anchor="middle">NPN</text>
<path d="M 1000.0 420.0 L 1050.0 420.0 L 1050.0 396.0" class="sig"/>
<rect x="1046.0" y="372.0" width="8.0" height="24.0" rx="1" class="box" />
<text x="1058.0" y="387.0" class="s" >100k</text>
<path d="M 1050.0 372.0 L 1050.0 372.0" class="pnk"/>
<path d="M 1050.0 420.0 L 1120.0 420.0" class="blu"/>
<path d="M 1129.0 415.0 L 1129.0 425.0 L 1140.0 420.0 Z" class="sig"/>
<line x1="1140.0" y1="415.0" x2="1140.0" y2="425.0" class="sig"/>
<path d="M 1141.0 420.0 L 1190.0 420.0" class="blu"/>
<text x="1192.0" y="424.0" class="s" >→ wake strip → pin 7</text>
<path d="M 980.0 450.0 L 980.0 470.0" class="gnd"/>
<line x1="980.0" y1="470.0" x2="980.0" y2="478.0" class="gnd"/>
<line x1="972.0" y1="478.0" x2="988.0" y2="478.0" class="gnd"/>
<line x1="975.0" y1="482.0" x2="985.0" y2="482.0" class="gnd"/>
<line x1="978.0" y1="486.0" x2="982.0" y2="486.0" class="gnd"/>
<text x="760.0" y="520.0" class="d" >Switch open: node ≥ 4 V → base current flows → collector held LOW → nothing.</text>
<text x="760.0" y="536.0" class="d" >Any switch on the node closes to ground → base falls → transistor off → collector rises to 12 V</text>
<text x="760.0" y="552.0" class="d" >→ pin 7 high → PMU wakes, reads the ladder, acts. One 1N5819, one 2N3904, three resistors per node.</text>
<text x="760.0" y="568.0" class="d" >The 1 MΩ shifts the ladder by ~1.5 counts; the windows absorb it.</text>
</svg>