<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11">
<style>
.t{fill:#1b1b1b}.d{fill:#5d6d7e}.h{font-weight:700;fill:#1b1b1b}.w{fill:#fff}
.box{fill:#fff;stroke:#1b1b1b;stroke-width:1.2}
.zone{fill:#f4f6f6;stroke:#5d6d7e;stroke-width:1;stroke-dasharray:4 3}
.hdr{fill:#1b1b1b}
.pwr{stroke:#c0392b;stroke-width:3;fill:none}
.pwr2{stroke:#c0392b;stroke-width:1.8;fill:none}
.sig{stroke:#1b1b1b;stroke-width:1.3;fill:none}
.cap{stroke:#7f8c8d;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
.gnd{stroke:#7f8c8d;stroke-width:1.4;fill:none}
.can{stroke:#1f77b4;stroke-width:1.4;fill:none;stroke-dasharray:6 3}
.blu{stroke:#1f77b4;stroke-width:1.3;fill:none}
.org{stroke:#e67e22;stroke-width:1.6;fill:none}
.vio{stroke:#8e44ad;stroke-width:1.3;fill:none}
.gry{stroke:#7f8c8d;stroke-width:1.2;fill:none}
.pnk{stroke:#e84393;stroke-width:1.2;fill:none}
.red{stroke:#c0392b;stroke-width:1.6;fill:none}
.s{font-size:10;fill:#5d6d7e}.b{fill:#1f77b4}.r{fill:#c0392b}
.mono{font-family:ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace}
</style>
<rect width="1200" height="640" fill="#fbfbf9"/>
<text x="20" y="30" font-size="18" class="h">Plate layout — zoning</text>
<text x="20" y="48" class="d">Dimensions come from the dash-envelope measurement (measured on the car first). The arrangement below survives the measurement; only the outline changes</text>
<rect x="60.0" y="80.0" width="1080.0" height="460.0" rx="0" class="box" />
<rect x="80.0" y="100.0" width="150.0" height="60.0" rx="0" class="zone" />
<text x="90.0" y="120.0" class="h" >BATT LUG · GND LUG</text>
<text x="90.0" y="136.0" class="s" >DP-BAT 2 AWG · DP-GND 10 AWG</text>
<rect x="250.0" y="100.0" width="220.0" height="60.0" rx="0" class="zone" />
<text x="260.0" y="120.0" class="h" >ALWAYS-HOT BUSBAR</text>
<text x="260.0" y="136.0" class="s" >Blue Sea 2301, next to the stud</text>
<rect x="490.0" y="100.0" width="220.0" height="60.0" rx="0" class="zone" />
<text x="500.0" y="120.0" class="h" >GROUND BUS</text>
<text x="500.0" y="136.0" class="s" >adjacent to pin 25</text>
<rect x="80.0" y="180.0" width="400.0" height="200.0" rx="0" class="box" />
<text x="90.0" y="200.0" class="h" >PMU-24 DL  131 × 112 × 32.5 mm</text>
<text x="90.0" y="216.0" class="s" >3 × M6 stand-offs · connector on the short edge · leave the lever arc clear</text>
<rect x="100.0" y="360.0" width="360.0" height="14.0" rx="0" class="hdr" />
<text x="280.0" y="371.0" class="w" text-anchor="middle">39-WAY CONNECTOR · LEVER ARC ↓</text>
<rect x="500.0" y="180.0" width="220.0" height="90.0" rx="0" class="zone" />
<text x="510.0" y="200.0" class="h" >WAKE STRIP (8-pos)</text>
<text x="510.0" y="216.0" class="s" >+ 2 sense stages + bias</text>
<text x="510.0" y="232.0" class="s" >on a small perfboard</text>
<rect x="740.0" y="100.0" width="380.0" height="170.0" rx="0" class="zone" />
<text x="750.0" y="120.0" class="h" >FUSE BLOCKS A · B · C · D</text>
<text x="750.0" y="136.0" class="s" >4 × BLR-504, labelled on the plate</text>
<text x="750.0" y="152.0" class="s" >F12 · F15 · F16 sealed inlines beside them</text>
<text x="750.0" y="168.0" class="s" >A and B reachable with the panel fitted</text>
<rect x="500.0" y="290.0" width="620.0" height="90.0" rx="0" class="zone" />
<text x="510.0" y="310.0" class="h" >RELAY BANK — 10 sockets, 4 populated</text>
<text x="510.0" y="326.0" class="s" >K1 K2 K11 K12 · K3 K4 + 4 spare, all labelled · keep the bank away from the signal receptacles</text>
<rect x="80.0" y="400.0" width="1040.0" height="120.0" rx="0" class="zone" />
<text x="90.0" y="420.0" class="h" >RECEPTACLE EDGE(S) — grouped by leg, ~500 mm of frontage, two edges likely</text>
<text x="90.0" y="440.0" class="t" >L1: P S1 S2   |   L2: P1 P2 M S   |   L3: P M S1 S2 S3   |   L4: P M S   ||   drops: DP-CLU DP-DIAG DP-ICU DP-DCU DP-KEY</text>
<text x="90.0" y="460.0" class="s" >Each receptacle on a 1027-003-1200 clip · leg housings sit together so a leg unplugs as a unit · 60 mm clear behind every receptacle face</text>
<text x="90.0" y="480.0" class="s" >Every relay position and fuse position is labelled ON THE PLATE, not on the component</text>
<text x="60.0" y="570.0" class="d" >Material: 3 mm aluminium, anodised or powder-coated (never bare — it is a ground-plane risk). Four rubber-isolated mounts. The panel must unbolt and withdraw as a unit with every leg unplugged.</text>
</svg>